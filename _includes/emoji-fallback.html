{%- comment -%} 🪺 (Emoji 14.0, 2021) shows as an empty box on iOS < 15.4 / Android < 12L / older Windows: an element that carries data-fb swaps to that older emoji when the browser cannot draw the first one (a colour-emoji glyph has coloured pixels; a tofu box is monochrome). {%- endcomment -%}
<script>
(function(){var els=document.querySelectorAll('[data-fb]');if(!els.length)return;function ok(ch){try{var c=document.createElement('canvas');c.width=c.height=20;var x=c.getContext('2d');if(!x)return true;x.textBaseline='top';x.font='16px sans-serif';x.fillText(ch,0,0);var d=x.getImageData(0,0,20,20).data;for(var i=0;i<d.length;i+=4){if(d[i+3]&&(d[i]!==d[i+1]||d[i+1]!==d[i+2]))return true;}return false;}catch(e){return true;}}var seen={};for(var i=0;i<els.length;i++){var el=els[i],ch=el.textContent.trim();if(!(ch in seen))seen[ch]=ok(ch);if(!seen[ch])el.textContent=el.getAttribute('data-fb');}})();
</script>
