# Jekyll config for Aquora's GitHub Pages site.
# Served at https://aquora-app.github.io/Aquora/ from the `docs/` folder.

title: Aquora
description: Decode your phone personality from real screen-time behavior.
url: https://aquora-app.github.io
baseurl: /Aquora

# kramdown is GitHub Pages' default — explicit for clarity.
markdown: kramdown

# Files in /p/ default to the archetype layout, so each stub doesn't need
# to redeclare it. Keeps stub files down to ~3 lines each.
defaults:
  - scope:
      path: "p"
    values:
      layout: archetype

# Root index.html is the marketing home page (bilingual EN/zh, mirrors the
# mainland cn/index.html design). The legacy Terms/Privacy page is split into
# en/privacy.html (/privacy/), en/terms.html (/terms/) and en/support.html
# (/support/); the home page redirects old #terms/#privacy deep links there and
# legal/index.html (/legal/) forwards likewise, so App/ASC links keep working.

# Site-wide values used by the home page (the mainland overlay overrides them).
app_store_url: https://apps.apple.com/app/id6761502736
contact_email: aquora.apps@gmail.com

# Skip files that don't need processing — keeps the build fast and avoids
# Jekyll trying to parse README, etc.
# Pre-launch mode (2026-09-06): only /reserve/ and the policy pages are public.
# The homepage and the 17 /p/ pages (and the retired /forecast/) are replaced by redirect stubs
# (en/prelaunch/, layout prelaunch-redirect). To reopen the site: set prelaunch
# to false, delete the three excludes below marked PRELAUNCH, and exclude en/prelaunch/.
prelaunch: true
exclude:
  - index.html     # PRELAUNCH
  - p/             # PRELAUNCH
  - forecast/      # RETIRED for good (Abel 2026-09-06): the forecast lives in the app; keep excluded after reopening (stub en/prelaunch/forecast.html then points home)
  - README.md
  - "*.txt"
  # 大陆站(aquora.cn)专属源文件,只在 --config _config.yml,_config_cn.yml 下构建。
  # (英文首页与大陆首页共用 home.css / cn-fonts.css / assets/fonts/;英文截图在 assets/img/app/en/。)
  - "cn/"
  - assets/css/cn.css
  - assets/img/wx-share.png
  - assets/img/psb.png
  # (逐个列出:Jekyll 的 fnmatch 不带 FNM_PATHNAME,"assets/img/app/*.jpg" 会连 app/en/light/*.jpg 一起排掉)
  - assets/img/app/home.jpg
  - assets/img/app/meditate.jpg
  - assets/img/app/track.jpg
  - assets/img/app/personality.jpg
  - assets/img/app/me.jpg
  - assets/img/app/dark/
  - assets/img/app/icon-512.png
  - tools/
  # 预约收单服务源码(部署到服务器,不是站点页面)
  - server/
  - _config_cn.yml
